version: 1.3.14
fileConfig:
  endpoints:
    default:
      supportedMimeTypes:
        - "image/.*"
        - "application/pdf"
        - "text/.*"
        - "text/x-c"
        - "text/x-chdr"
        - "text/x-csrc"
        - "text/x-object"
        - "application/octet-stream"
    OpenRouter:
      supportedMimeTypes:
        - "image/.*"
        - "application/pdf"
        - "text/.*"
        - "text/x-c"
        - "text/x-chdr"
        - "text/x-csrc"
        - "text/x-object"
        - "application/octet-stream"
  serverFileSizeLimit: 100
summarization:
  enabled: true
  provider: "OpenRouter"
  model: "deepseek/deepseek-chat-v3.1"
  maxSummaryTokens: 2048
  reserveRatio: 0.05
  trigger:
    type: "token_ratio"
    value: 0.75
  retainRecent:
    turns: 4
endpoints:
  custom:
    - name: "OpenRouter"
      apiKey: "${OPENROUTER_KEY}"
      baseURL: "https://openrouter.ai/api/v1"
      models:
        default:
          - "anthropic/claude-sonnet-5"
          - "deepseek/deepseek-r1-0528"
          - "openai/o4-mini"
          - "deepseek/deepseek-chat-v3.1"
        fetch: false
      titleConvo: true
      titleModel: "deepseek/deepseek-chat-v3.1"
      titleTiming: "immediate"
      titleMethod: "completion"
      dropParams: ["stop"]
      customParams:
        defaultParamsEndpoint: custom
        reasoningFormat: disabled
      activityLabel: true
      activityModel: "deepseek/deepseek-chat-v3.1"
      modelDisplayNames:
        "anthropic/claude-sonnet-5": "Claude Sonnet 5"
        "deepseek/deepseek-r1-0528": "DeepSeek R1 0528"
        "openai/o4-mini": "OpenAI o4-mini"
        "deepseek/deepseek-chat-v3.1": "DeepSeek Chat"
modelSpecs:
  # --- hides raw endpoint selector to only show clean defined presets --- #
  enforce: true
  prioritize: true
  list:
    # --- Claude Sonnet variants, thinking off -> high --- #
    - name: "main-coder-off"
      label: "Main Coder — No Thinking"
      description: "Sonnet 5, reasoning fully disabled. Fastest, cheapest, no hidden reasoning tokens."
      iconURL: "anthropic"
      group: "OpenRouter"
      preset:
        endpoint: "OpenRouter"
        model: "anthropic/claude-sonnet-5"
        temperature: 0.1
        addParams:
          reasoning:
            enabled: false
        promptPrefix: |
          You are an expert scientific software engineer specializing in high-performance C and vectorized Python (NumPy, SciPy).
          - Prioritize memory safety, cache locality, and explicit pointer handling.
          - Output clean, executable code blocks.
          - Explain edge cases or potential memory leaks briefly below code blocks.
    - name: "main-coder-low"
      label: "Main Coder — Low Effort"
      description: "Sonnet 5, low reasoning effort. Cheap, light thinking for routine tasks."
      iconURL: "anthropic"
      group: "OpenRouter"
      preset:
        endpoint: "OpenRouter"
        model: "anthropic/claude-sonnet-5"
        temperature: 0.1
        addParams:
          reasoning:
            effort: "low"
        promptPrefix: |
          You are an expert scientific software engineer specializing in high-performance C and vectorized Python (NumPy, SciPy).
          - Prioritize memory safety, cache locality, and explicit pointer handling.
          - Output clean, executable code blocks.
          - Explain edge cases or potential memory leaks briefly below code blocks.
    - name: "main-coder"
      label: "Main Coder — Medium Effort"
      description: "Sonnet 5, medium reasoning effort. Balanced default for scientific Python and C architecture."
      iconURL: "anthropic"
      default: true
      group: "OpenRouter"
      preset:
        endpoint: "OpenRouter"
        model: "anthropic/claude-sonnet-5"
        temperature: 0.1
        addParams:
          reasoning:
            effort: "medium"
        promptPrefix: |
          You are an expert scientific software engineer specializing in high-performance C and vectorized Python (NumPy, SciPy).
          - Prioritize memory safety, cache locality, and explicit pointer handling.
          - Output clean, executable code blocks.
          - Explain edge cases or potential memory leaks briefly below code blocks.
    - name: "main-coder-high"
      label: "Main Coder — High Effort"
      description: "Sonnet 5, high reasoning effort. Deepest thinking, highest cost — for hard bugs."
      iconURL: "anthropic"
      group: "OpenRouter"
      preset:
        endpoint: "OpenRouter"
        model: "anthropic/claude-sonnet-5"
        temperature: 0.1
        addParams:
          reasoning:
            effort: "high"
        promptPrefix: |
          You are an expert scientific software engineer specializing in high-performance C and vectorized Python (NumPy, SciPy).
          - Prioritize memory safety, cache locality, and explicit pointer handling.
          - Output clean, executable code blocks.
          - Explain edge cases or potential memory leaks briefly below code blocks.
    # --- fallback coding --- #
    - name: "fallback-coder"
      label: "Fallback Coder (DeepSeek R1)"
      description: "Deep reasoning engine for intractable bugs and complex logic"
      group: "OpenRouter"
      preset:
        endpoint: "OpenRouter"
        model: "deepseek/deepseek-r1-0528"
        promptPrefix: |
          You are an expert systems programmer. 
          - Use internal reasoning to analyze complex logic flows, compiler flags, and race conditions before producing final code output.
    # --- o4-mini variants, thinking off -> high --- #
    - name: "astrophysics-tutor-off"
      label: "Astrophysics Tutor — No Thinking"
      description: "o4-mini, reasoning fully disabled. Fastest, cheapest, no hidden reasoning tokens."
      iconURL: "openai"
      group: "OpenRouter"
      preset:
        endpoint: "OpenRouter"
        model: "openai/o4-mini"
        addParams:
          reasoning:
            enabled: false
        promptPrefix: |
          You are an expert theoretical and computational astrophysicist as well as university tutor.
          - Render all mathematical derivations and numerical concepts using explicit LaTeX syntax ($...$ for inline, $$...$$ for block).
          - Break solutions down sequentially: Assumptions, Fundamental Equations, Derivation, Dimensional Check.
    - name: "astrophysics-tutor-low"
      label: "Astrophysics Tutor — Low Effort"
      description: "o4-mini, low reasoning effort. Cheap, light thinking for routine tasks."
      iconURL: "openai"
      group: "OpenRouter"
      preset:
        endpoint: "OpenRouter"
        model: "openai/o4-mini"
        addParams:
          reasoning:
            effort: "low"
        promptPrefix: |
          You are an expert theoretical and computational astrophysicist as well as university tutor.
          - Render all mathematical derivations and numerical concepts using explicit LaTeX syntax ($...$ for inline, $$...$$ for block).
          - Break solutions down sequentially: Assumptions, Fundamental Equations, Derivation, Dimensional Check.
    - name: "astrophysics-tutor"
      label: "Astrophysics Tutor — Medium Effort"
      description: "o4-mini, medium reasoning effort. Balanced default for STEM logic and physics derivations."
      iconURL: "openai"
      group: "OpenRouter"
      preset:
        endpoint: "OpenRouter"
        model: "openai/o4-mini"
        addParams:
          reasoning:
            effort: "medium"
        promptPrefix: |
          You are an expert theoretical and computational astrophysicist as well as university tutor.
          - Render all mathematical derivations and numerical concepts using explicit LaTeX syntax ($...$ for inline, $$...$$ for block).
          - Break solutions down sequentially: Assumptions, Fundamental Equations, Derivation, Dimensional Check.
    - name: "astrophysics-tutor-high"
      label: "Astrophysics Tutor — High Effort"
      description: "o4-mini, high reasoning effort. Deepest thinking, highest cost — for hard derivations."
      iconURL: "openai"
      group: "OpenRouter"
      preset:
        endpoint: "OpenRouter"
        model: "openai/o4-mini"
        addParams:
          reasoning:
            effort: "high"
        promptPrefix: |
          You are an expert theoretical and computational astrophysicist as well as university tutor.
          - Render all mathematical derivations and numerical concepts using explicit LaTeX syntax ($...$ for inline, $$...$$ for block).
          - Break solutions down sequentially: Assumptions, Fundamental Equations, Derivation, Dimensional Check.
    # --- prose writing --- #
    - name: "writing-prose"
      label: "Prose Writer (DeepSeek Chat V3)"
      description: "Quick, cheap text editing and technical documentation drafting"
      group: "OpenRouter"
      preset:
        endpoint: "OpenRouter"
        model: "deepseek/deepseek-chat-v3.1"
        temperature: 0.7
        top_p: 0.90
        promptPrefix: |
          You are a technical editor for scientific and academic publications.
          - Help draft, structure, and refine documentation, LaTeX papers, and README files.
          - Maintain an active voice, precise academic vocabulary, and clear structural headers.
          - Eliminate wordiness and conversational filler.
